name: Publish tested image to ECR

on:
  workflow_call:
    inputs:
      role-arn:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      repository:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      image-tag:
        required: true
        type: string
    outputs:
      image-digest:
        description: "Published image manifest digest"
        value: ${{ jobs.publish.outputs.image-digest }}

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout digest selector
        uses: actions/checkout@v5
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/tested-image

      - name: Load tested image
        run: |
          docker load \
            --input "${RUNNER_TEMP}/tested-image/backend-image.tar"

          docker image inspect deal-engine-backend:ci >/dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
          allowed-account-ids: "989200477899"
          role-session-name: backend-publish-${{ github.run_id }}

      - name: Log in to ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        id: push
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
          REPOSITORY: ${{ inputs.repository }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail

          repository="${REGISTRY}/${REPOSITORY}"
          image="${repository}:${IMAGE_TAG}"

          docker tag deal-engine-backend:ci "$image"
          docker push "$image"

          digest="$(
            docker image inspect "$image" \
              --format '{{json .RepoDigests}}' |
              python3 scripts/select_image_digest.py "$repository"
          )"

          printf 'image-digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

          printf 'Published image: `%s@%s` (tag: `%s`)\n' \
            "$repository" "$digest" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
    outputs:
      image-digest: ${{ steps.push.outputs.image-digest }}