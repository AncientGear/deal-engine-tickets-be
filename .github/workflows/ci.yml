name: Backend CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: tickets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tickets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare test database
        env:
          PGPASSWORD: ci-test-only
        run: |
          psql \
            -h 127.0.0.1 \
            -U test \
            -d tickets_test \
            -v ON_ERROR_STOP=1 \
            -f 001_tickets.sql

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://test:ci-test-only@127.0.0.1:5432/tickets_test?sslmode=disable
        run: go test -v -count=1 ./...

      - name: Build container image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag deal-engine-backend:ci \
            .
      - name: Prepare application database
        env:
          PGPASSWORD: ci-test-only
        run: |
          psql \
            -h 127.0.0.1 \
            -U test \
            -d tickets_test \
            -v ON_ERROR_STOP=1 \
            -f 002_admin.sql
      - name: Start application container
        run: |
          docker run -d \
            --name backend-smoke \
            --network host \
            -e LISTEN_ADDR=127.0.0.1:8080 \
            -e DATABASE_URL='postgres://test:ci-test-only@127.0.0.1:5432/tickets_test?sslmode=disable' \
            -e TOKEN_SECRET='ci-only-secret-not-for-production-32-bytes' \
            -e ENABLE_LOCAL_SETUP=false \
            deal-engine-backend:ci
      - name: Check application health
        run: |
          ready=false

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --connect-timeout 1 \
              --max-time 2 \
              http://127.0.0.1:8080/readyz; then
              ready=true
              break
            fi

            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Backend did not become ready within the retry budget."
            exit 1
          fi

          curl --fail --silent --show-error \
            --max-time 2 \
            http://127.0.0.1:8080/healthz
      - name: Show container logs
        if: always()
        run: |
          if docker container inspect backend-smoke >/dev/null 2>&1; then
            docker logs backend-smoke
          fi

      - name: Remove application container
        if: always()
        run: |
          if docker container inspect backend-smoke >/dev/null 2>&1; then
            docker rm -f backend-smoke
          fi
      - name: Export tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          docker save \
            --output "${RUNNER_TEMP}/backend-image.tar" \
            deal-engine-backend:ci

      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  publish-dev:
       needs: test-and-build
       if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

       permissions:
         contents: read
         actions: read
         id-token: write

       uses: ./.github/workflows/publish-ecr.yml

       with:
         role-arn: arn:aws:iam::989200477899:role/dealengine-dev-github-ecr-publisher
         aws-region: us-east-2
         repository: dev-dealengine-ecr-repo
         artifact-name: backend-image-${{ github.sha }}-${{ github.run_attempt }}
         image-tag: run-${{ github.run_id }}-${{ github.run_attempt }}