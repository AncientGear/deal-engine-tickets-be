name: Publish tested image to ECR

on:
  workflow_call:
    inputs:
      role-arn:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      repository:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      image-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/tested-image

      - name: Load tested image
        run: |
          docker load \
            --input "${RUNNER_TEMP}/tested-image/backend-image.tar"

          docker image inspect deal-engine-backend:ci >/dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
          allowed-account-ids: "989200477899"
          role-session-name: backend-publish-${{ github.run_id }}

      - name: Log in to ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
          REPOSITORY: ${{ inputs.repository }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          image="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

          docker tag deal-engine-backend:ci "$image"
          docker push "$image"

          printf 'Published image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"