name: Backend CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04-arm

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: tickets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tickets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install GitOps tooling dependency
        run: python3 -m pip install PyYAML==6.0.3

      - name: Test GitOps digest tooling
        run: |
          python3 scripts/tests/test_select_image_digest.py -v
          python3 scripts/tests/test_update_dev_digest.py -v
          python3 scripts/tests/test_propose_dev.py -v
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare test database
        env:
          PGPASSWORD: ci-test-only
        run: |
          psql \
            -h 127.0.0.1 \
            -U test \
            -d tickets_test \
            -v ON_ERROR_STOP=1 \
            -f 001_tickets.sql

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://test:ci-test-only@127.0.0.1:5432/tickets_test?sslmode=disable
        run: go test -v -count=1 ./...

      - name: Build container image
        run: |
          docker build \
            --platform linux/arm64 \
            --tag deal-engine-backend:ci \
            .
      - name: Prepare application database
        env:
          PGPASSWORD: ci-test-only
        run: |
          psql \
            -h 127.0.0.1 \
            -U test \
            -d tickets_test \
            -v ON_ERROR_STOP=1 \
            -f 002_admin.sql
      - name: Start application container
        run: |
          docker run -d \
            --name backend-smoke \
            --network host \
            -e LISTEN_ADDR=127.0.0.1:8080 \
            -e DATABASE_URL='postgres://test:ci-test-only@127.0.0.1:5432/tickets_test?sslmode=disable' \
            -e TOKEN_SECRET='ci-only-secret-not-for-production-32-bytes' \
            -e ENABLE_LOCAL_SETUP=false \
            deal-engine-backend:ci
      - name: Check application health
        run: |
          ready=false

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --connect-timeout 1 \
              --max-time 2 \
              http://127.0.0.1:8080/readyz; then
              ready=true
              break
            fi

            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Backend did not become ready within the retry budget."
            exit 1
          fi

          curl --fail --silent --show-error \
            --max-time 2 \
            http://127.0.0.1:8080/healthz
      - name: Show container logs
        if: always()
        run: |
          if docker container inspect backend-smoke >/dev/null 2>&1; then
            docker logs backend-smoke
          fi

      - name: Remove application container
        if: always()
        run: |
          if docker container inspect backend-smoke >/dev/null 2>&1; then
            docker rm -f backend-smoke
          fi
      - name: Export tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          docker save \
            --output "${RUNNER_TEMP}/backend-image.tar" \
            deal-engine-backend:ci

      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  publish-dev:
       needs: test-and-build
       if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

       permissions:
         contents: read
         actions: read
         id-token: write

       uses: ./.github/workflows/publish-ecr.yml

       with:
         role-arn: arn:aws:iam::989200477899:role/dealengine-dev-github-ecr-publisher
         aws-region: us-east-2
         repository: dev-dealengine-ecr-repo
         artifact-name: backend-image-${{ github.sha }}-${{ github.run_attempt }}
         image-tag: ${{ github.run_id }}-${{ github.run_attempt }}

  propose-dev:
       needs: publish-dev
       if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
       runs-on: ubuntu-24.04

       permissions:
         contents: read

       concurrency:
         group: backend-gitops-dev
         cancel-in-progress: false

       steps:
         - name: Checkout promotion tooling
           uses: actions/checkout@v5
           with:
             path: automation
             persist-credentials: false

         - name: Install GitOps tooling dependency
           run: python3 -m pip install PyYAML==6.0.3

         - name: Test GitOps digest tooling
           run: |
             python3 automation/scripts/tests/test_select_image_digest.py -v
             python3 automation/scripts/tests/test_update_dev_digest.py -v
             python3 automation/scripts/tests/test_propose_dev.py -v

         - name: Validate published digest
           env:
             IMAGE_DIGEST: ${{ needs.publish-dev.outputs.image-digest }}
           run: |
             if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
               printf '%s\n' 'Missing or invalid published image digest.' >&2
               exit 1
             fi

         - name: Create GitOps installation token
           id: app-token
           uses: actions/create-github-app-token@v2
           with:
             app-id: ${{ vars.GITOPS_APP_ID }}
             private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
             owner: AncientGear
             repositories: dealengine-argo-ops
             permission-contents: write
             permission-pull-requests: write

         - name: Checkout GitOps main
           uses: actions/checkout@v5
           with:
             repository: AncientGear/dealengine-argo-ops
             ref: main
             path: gitops
             token: ${{ steps.app-token.outputs.token }}
             persist-credentials: false

         - name: Update dev digest locally
           env:
             IMAGE_DIGEST: ${{ needs.publish-dev.outputs.image-digest }}
           run: |
             python3 automation/scripts/update_dev_digest.py \
               gitops/environments/dev/values.yaml \
               "$IMAGE_DIGEST"

         - name: Propose dev deployment
           env:
             GH_TOKEN: ${{ steps.app-token.outputs.token }}
             IMAGE_DIGEST: ${{ needs.publish-dev.outputs.image-digest }}
           run: |
             set -euo pipefail

             if git -C gitops diff --quiet; then
               printf '%s\n' 'Digest already selected; no PR required.'
               exit 0
             fi

             changed="$(git -C gitops diff --name-only)"
             if [[ "$changed" != "environments/dev/values.yaml" ]]; then
               printf '%s\n' 'Unexpected GitOps changes; proposal aborted.' >&2
               exit 1
             fi

             repository="AncientGear/dealengine-argo-ops"
             branch="automation/dev-image/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
             base_sha="$(git -C gitops rev-parse HEAD)"
             file_sha="$(git -C gitops rev-parse HEAD:environments/dev/values.yaml)"

             gh api "repos/${repository}/git/refs" \
               --method POST \
               -f ref="refs/heads/${branch}" \
               -f sha="$base_sha" \
               --silent

             content="$(base64 -w 0 gitops/environments/dev/values.yaml)"

             gh api "repos/${repository}/contents/environments/dev/values.yaml" \
               --method PUT \
               -f branch="$branch" \
               -f sha="$file_sha" \
               -f message="chore(dev): promote backend image ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
               -f content="$content" \
               --silent

             body="$(printf '%s\n' \
               'Updates only the backend dev image digest.' \
               '' \
               "Image: 989200477899.dkr.ecr.us-east-2.amazonaws.com/dev-dealengine-ecr-repo@${IMAGE_DIGEST}" \
               "Source commit: ${GITHUB_SHA}" \
               "Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
               '' \
               'Merging this PR triggers Argo auto-sync in dev.' \
               'Verify this proposal is still the intended version; older runs may finish later.')"

             url="$(gh api "repos/${repository}/pulls" \
               --method POST \
               -f base=main \
               -f head="$branch" \
               -f title="chore(dev): promote backend image ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
               -f body="$body" \
               --jq '.html_url')"

             printf 'GitOps proposal: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"