name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: tickets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tickets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare test database
        env:
          PGPASSWORD: ci-test-only
        run: |
          psql \
            -h 127.0.0.1 \
            -U test \
            -d tickets_test \
            -v ON_ERROR_STOP=1 \
            -f 001_tickets.sql

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://test:ci-test-only@127.0.0.1:5432/tickets_test?sslmode=disable
        run: go test -v -count=1 ./...

      - name: Build container image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag deal-engine-backend:ci \
            .