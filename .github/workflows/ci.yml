name: Backend CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: tickets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tickets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare test database
        env:
          PGPASSWORD: ci-test-only
        run: |
          psql \
            -h 127.0.0.1 \
            -U test \
            -d tickets_test \
            -v ON_ERROR_STOP=1 \
            -f 001_tickets.sql

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://test:ci-test-only@127.0.0.1:5432/tickets_test?sslmode=disable
        run: go test -v -count=1 ./...

      - name: Build container image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag deal-engine-backend:ci \
            .
      - name: Prepare application database
        env:
          PGPASSWORD: ci-test-only
        run: |
          psql \
            -h 127.0.0.1 \
            -U test \
            -d tickets_test \
            -v ON_ERROR_STOP=1 \
            -f 002_admin.sql
      - name: Start application container
        run: |
          docker run -d \
            --name backend-smoke \
            --network host \
            -e LISTEN_ADDR=127.0.0.1:8080 \
            -e DATABASE_URL='postgres://test:ci-test-only@127.0.0.1:5432/tickets_test?sslmode=disable' \
            -e TOKEN_SECRET='ci-only-secret-not-for-production-32-bytes' \
            -e ENABLE_LOCAL_SETUP=false \
            deal-engine-backend:ci
      - name: Check application health
        run: |
          ready=false

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --connect-timeout 1 \
              --max-time 2 \
              http://127.0.0.1:8080/readyz; then
              ready=true
              break
            fi

            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Backend did not become ready within the retry budget."
            exit 1
          fi

          curl --fail --silent --show-error \
            --max-time 2 \
            http://127.0.0.1:8080/healthz
      - name: Show container logs
        if: always()
        run: |
          if docker container inspect backend-smoke >/dev/null 2>&1; then
            docker logs backend-smoke
          fi

      - name: Remove application container
        if: always()
        run: |
          if docker container inspect backend-smoke >/dev/null 2>&1; then
            docker rm -f backend-smoke
          fi
      - name: Inspect OIDC identity claims
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );

            core.info(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              ref: claims.ref,
              environment: claims.environment
            }, null, 2));
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::989200477899:role/dealengine-dev-github-ecr-publisher
          aws-region: us-east-2
          role-session-name: backend-ci-${{ github.run_id }}

      - name: Verify AWS identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: aws sts get-caller-identity